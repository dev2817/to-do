services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '5000:80'
    restart: always
  gateway:
    build:
      context: ./server/gateway
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    env_file:
      - ./server/gateway/.env
    volumes:
      - ./server/gateway:/app
    command: pnpm run start